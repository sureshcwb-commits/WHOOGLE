<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Whoogle — Private Web Search</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <main class="shell">
    <header class="brand-area">
      <a class="brand" href="./" aria-label="Whoogle home">whoogle<span>.</span></a>
      <p class="tagline">Search the web</p>
    </header>
    <form id="search-form" class="search-form">
      <label class="sr-only" for="query">Search query</label>
      <input id="query" name="q" type="search" placeholder="Search anything on the web…" autocomplete="off" maxlength="200" required>
      <button type="submit">Search</button>
    </form>
    <nav class="tabs" aria-label="Search category">
      <button type="button" class="tab active" data-category="web">All</button>
      <button type="button" class="tab" data-category="news">News</button>
      <button type="button" class="tab" data-category="images">Images</button>
    </nav>
    <p class="hint">Live web results from an external search provider. Results may be rate-limited.</p>
    <section id="status" role="status" aria-live="polite"></section>
    <section id="results" aria-label="Search results"></section>
    <nav id="pagination" aria-label="Search pages"></nav>
    <footer>Whoogle-style independent search · Live results are provided by third-party search services.</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
